[package]
name = "beehaven"
version = "0.1.0"
description = "Calm visual hive for running parallel AI coding agents in git worktrees with conflict forecasting and a test-gated merge queue"
authors = ["noodlestack"]
license = "MIT"
repository = "https://github.com/noodlestack/beehaven"
edition = "2021"
rust-version = "1.90"

[lib]
name = "beehaven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
portable-pty = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = { version = "12", features = [] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
