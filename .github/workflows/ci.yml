name: Beehaven CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  quality-and-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install cargo-audit & cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify WCAG AA design token contrast
        run: pnpm contrast

      - name: Frontend lint, typecheck, test, and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Rust format, clippy, and integration tests
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Supply-chain security & license checks
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          cargo audit
          cargo deny check
